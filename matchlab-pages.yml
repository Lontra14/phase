# Rogue Forge MatchLab — build the static site and hand it back as a ZIP.
#
# Nothing is hosted on GitHub: this only compiles the site (rules engine,
# card database, client) on GitHub's free runners. Download the artifact
# "matchlab-site" from the finished run and upload its contents to your domain.
#
# Run: Actions → "MatchLab site build" → Run workflow (or push to `matchlab`).

name: MatchLab site build

on:
  workflow_dispatch:
  push:
    branches: [matchlab]

permissions:
  contents: read

concurrency:
  group: matchlab-site
  cancel-in-progress: true

jobs:
  build:
    name: Build engine, card data and client
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
          cache-shared-key: matchlab-wasm
          rustflags: ""

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.121

      - name: Install wasm-opt + jq
        run: sudo apt-get update -y && sudo apt-get install -y binaryen jq

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Build the site
        run: bash ./scripts/build-matchlab-site.sh matchlab-site

      - uses: actions/upload-artifact@v4
        with:
          name: matchlab-site
          path: matchlab-site
          include-hidden-files: true
          retention-days: 14
